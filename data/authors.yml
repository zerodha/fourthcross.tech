# Maintainers. One entry per GitHub handle appearing as `author_github` in
# featured.yml or data/projects/<owner>.yml. build.py renders one
# content/authors/<github>.md page from each entry and fails if a project
# references a handle that is missing here.
#
#   github     GitHub handle, lowercased. The join key, and the page URL:
#              /authors/<github>/. Required and unique.
#   name       Display name, shown as the page heading. Falls back to the
#              handle when empty.
#   homepage   Personal site. Rendered beside the handle. Optional.
#   email      Rendered beside the handle as a mailto link. Optional.
#   avatar     Path relative to static/. Optional.
#   bio        One or two sentences, rendered under the name. Optional.

