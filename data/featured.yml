# Featured projects — a hand-curated list rendered with a large splash
# screenshot on the homepage, in the order below. data/projects/<owner>.yml
# holds everything else and uses this same schema. An entry lives in exactly
# one place: promoting a project means moving it here from its owner's file.
#
#   name           Display name (may differ from the repo name).
#   description    One or two sentences.
#   category       apps | services | libs | utils
#   dogfood        true when the project runs in production at Zerodha.
#   language       Primary language.
#   license        SPDX identifier. Empty when the repo has no recognised license.
#   stars          GitHub star count.
#   topics         GitHub topics.
#   updated_at     Last push, ISO 8601.
#   github_uri     owner/repo.
#   repo_url       Source repository.
#   homepage_url   Project site. Falls back to repo_url when empty.
#   image          Splash screenshot, relative to static/. Optional.
#   logo           Wordmark, relative to static/. Rendered instead of the name.
#   author_github  Maintainer's GitHub handle, lowercased. Must have an entry in
#                  data/authors.yml, which holds the display name and links.
#                  Empty for org-owned repos, which render without an author.

