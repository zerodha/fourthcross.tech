<!DOCTYPE html>
<html lang="{{ lang | default(value=config.default_language) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">

  <link rel="icon" href="{{ get_url(path='logo.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='oat.min.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <script src="{{ get_url(path='oat.min.js') }}" defer></script>

  <meta property="og:image" content="{{ get_url(path='thumb.png') }}">

  <script>
    (() => {
      const root = document.documentElement;
      const store = (() => { try { return localStorage } catch { return null } })();
      const saved = store && store.getItem("theme");
      if (saved) root.dataset.theme = saved;

      addEventListener("click", (e) => {
        if (!e.target.closest("[data-theme-toggle]")) return;
        const current = root.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const next = current === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        if (store) store.setItem("theme", next);
      });
    })();
  </script>
</head>
<body>

  {% block body %}{% endblock body %}

  {% include "partials/footer.html" %}

</body>
</html>
