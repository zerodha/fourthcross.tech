<!DOCTYPE html>
<html lang="{{ lang | default(value=config.default_language) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- block meta %}
    {% set_global meta_title = config.title %}
    {% set_global meta_description = config.description %}
  {% endblock meta %}

  <title>{{ meta_title }}</title>
  <meta name="description" content="{{ meta_description }}">

  <link rel="canonical" href="{{ current_url | default(value=config.base_url) }}">
  <link rel="icon" href="{{ get_url(path='favicon.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='oat.min.css') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
  <script src="{{ get_url(path='oat.min.js') }}" defer></script>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:url" content="{{ current_url | default(value=config.base_url) }}">
  <meta property="og:title" content="{{ meta_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:image" content="{{ get_url(path='thumb.png') }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="751">
  <meta property="og:image:height" content="751">
  <meta property="og:image:alt" content="{{ config.title }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ meta_title }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ get_url(path='thumb.png') }}">

  <script>
    (() => {
      const root = document.documentElement;
      const store = (() => { try { return localStorage } catch { return null } })();
      const saved = store && store.getItem("theme");
      if (saved) root.dataset.theme = saved;

      addEventListener("click", (e) => {
        if (!e.target.closest("[data-theme-toggle]")) return;
        const current = root.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const next = current === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        if (store) store.setItem("theme", next);
      });
    })();
  </script>
</head>
<body>

  {% block body %}{% endblock body %}

  {% include "partials/footer.html" %}

</body>
</html>
