{# `brand` is set by templates that have no <h1> of their own (i.e. everything
   except the homepage, where the hero already names the site). #}
<nav class="hero-nav container">
  {% if brand %}<a class="brand" href="{{ get_url(path='@/_index.md') }}">{{ config.title }}</a>{% endif %}
  <div class="hstack links">
    <a href="{{ get_url(path='@/_index.md') }}#projects">Projects</a>
    <a href="{{ config.extra.blog_url }}">Blog</a>
    <a href="{{ config.extra.github_url }}">GitHub</a>
  </div>
</nav>
