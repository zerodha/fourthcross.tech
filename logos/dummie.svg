<svg width="360" height="100" viewBox="0 0 360 100" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Horizontal lockup: the mark from logo.svg with the wordmark beside it.
       The blink is kept declarative so it survives being loaded as an image. -->
  <style>
    .lid {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); opacity: 1; }
      95% { transform: scaleY(0.04); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .lid { animation: none; }
    }

    /* The wordmark sits on whatever is behind it, so it follows the viewer's
       scheme here: loaded as an image, this file never sees the host stylesheet. */
    .word { fill: #0B1A1E; }
    .slash { fill: #2F9E72; }

    @media (prefers-color-scheme: dark) {
      .word { fill: #F2F5F4; }
      .slash { fill: #48D597; }
    }
  </style>

  <rect width="100" height="100" rx="22" fill="#48D597"/>

  <g transform="translate(50 50) scale(0.86) translate(-50 -50)" stroke="#0B1A1E">
    <circle cx="50" cy="50" r="44" stroke-width="5"/>
    <line x1="28" y1="39" x2="72" y2="39" stroke-width="1.5"/>

    <g class="lid">
      <polygon points="50,27 72,39 50,51 28,39" fill="#0B1A1E" stroke="none"/>
      <line x1="50" y1="27" x2="50" y2="51" stroke-width="1.5"/>
    </g>
  </g>

  <text class="word" x="128" y="68" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="50" font-weight="600">
    dummie<tspan class="slash">/</tspan>
  </text>
</svg>
