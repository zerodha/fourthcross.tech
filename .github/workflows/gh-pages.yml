name: build-site

on:
  push:
    branches:
      - master
  schedule:
    # Github sync weekly.
    - cron: '0 3 * * 1'
  # Manual run from the UI when necessary.
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: sync
        options:
          - sync
          - build

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync from GitHub
        if: github.event_name == 'schedule' || inputs.mode == 'sync'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python build.py sync-github
          if git diff --quiet -- data/; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m 'Sync project metadata from GitHub.'
          # master may have moved while the sync was running.
          git pull --rebase origin master
          git push

      - name: Generate content
        run: python build.py build

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1

      - name: Build
        run: zola build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: fourthcross.tech
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
